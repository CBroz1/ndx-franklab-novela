name: Black
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  black:
    name: Check code formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Black
        uses: psf/black@stable
        with:
          # Options and line length come from [tool.black] in pyproject.toml.
          options: "--check --diff"
