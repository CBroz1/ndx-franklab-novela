default_stages: [pre-commit, pre-push]

# docs/ holds Sphinx sources and generated API docs; [tool.black] in
# pyproject.toml already excludes it, so keep the two consistent.
exclude: ^docs/

repos:
  - repo: https://github.com/executablebooks/mdformat
    # Do this before other tools "fixing" the line endings
    rev: 1.0.0
    hooks:
      - id: mdformat
        name: Format Markdown
        entry: mdformat # Executable to run, with fixed options
        language: python
        types: [markdown]
        args: [--wrap, "80", --number]
        additional_dependencies:
          - mdformat-footnote
          - mdformat-gfm
          - mdformat-toc

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
        # spec/*.yaml is generated by src/spec/create_extension_spec.py --
        # never hand-edited. See trailing-whitespace below.
        exclude: ^spec/
      - id: mixed-line-ending
        args: ["--fix=lf"]
        description: Forces to replace line ending by the UNIX 'lf' character.
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        # The generator emits a trailing space at a YAML line-wrap point in
        # ndx-franklab-novela.namespace.yaml. Stripping it here would put the
        # committed spec permanently out of sync with what regenerating
        # produces, and make any regeneration check fail on a phantom diff.
        exclude: ^spec/
      - id: debug-statements
      - id: check-added-large-files # prevent giant files from being committed
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-docstring-first
      - id: check-case-conflict
      - id: fix-byte-order-marker

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Generated spec is not linted, for the same reason it is not
        # whitespace-fixed above: the emitter leaves trailing spaces at
        # line-wrap points (40 such lines in the committed
        # ndx-franklab-novela.extensions.yaml today).
        exclude: ^spec/
        args:
          - --no-warnings
          - -d
          # line-length is disabled rather than capped: the CI matrix in
          # .github/workflows/run_all_tests.yml uses deliberately aligned
          # rows up to ~143 chars, and the generated spec carries long `doc`
          # strings. The structural checks are the valuable part here.
          - "{extends: relaxed, rules: {line-length: disable}}"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned to the version installed in the dev env so the hook and a local
    # `ruff check` cannot disagree.
    rev: v0.15.7
    hooks:
      - id: ruff
        # No args on purpose: select/ignore/per-file-ignores all come from
        # [tool.ruff] in pyproject.toml, which is also what CI's ruff action
        # reads.

  # NOTE: autoflake is deliberately NOT used here, unlike in spyglass.
  # src/pynwb/ndx_franklab_novela/__init__.py imports ndx_optogenetics purely
  # for its side effect of registering the namespace that
  # FrankLabOptogeneticEpochsTable depends on. It is marked `# noqa: F401`,
  # but an unused-import remover is the wrong tool to point at this package.

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: [--toml, pyproject.toml]
        additional_dependencies:
          - tomli

  - repo: https://github.com/psf/black-pre-commit-mirror
    # Keep in step with the dev env and with .github/workflows/black.yml;
    # line-length comes from [tool.black] in pyproject.toml.
    rev: 26.3.1
    hooks:
      - id: black
        language_version: python3
